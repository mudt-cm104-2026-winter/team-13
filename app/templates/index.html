<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reading List</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <h1>Reading List</h1>
    <p class="intro">Books we want to read together</p>

    <form class="add" action="/add" method="post">
      <input name="title" placeholder="Book title" required autocomplete="off">
      <input name="author" placeholder="Author" required autocomplete="off">
      <button type="submit">Add book</button>
    </form>

    {% if entries %}
    <p>Total books on your list: {{ entries|length }}</p>
    <table>
      <thead>
        <tr><th>Title</th><th>Author</th><th>Action</th></tr>
      </thead>
      <tbody>
        {% for entry in entries %}
        <tr>
          <td>{{ entry.title }}</td>
          <td>{{ entry.author }}</td>
          <td>
            <form action="/delete/{{ entry.id }}" method="post">
              <button type="submit">Remove</button>
            </form>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    {% else %}
    <p class="empty">No books added yet.</p>
    {% endif %}
  </main>
</body>
</html>
